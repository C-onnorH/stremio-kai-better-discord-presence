# Discord presence for Stremio Kai  (scripts/discord-presence)
# Restart Kai after changing anything here.

enabled=yes

# Discord application that shows the presence. This is the ID the Stremio shell
# already uses, so the app is called "Stremio". To use your own name/icon, create
# an application at https://discord.com/developers/applications and paste its
# Application ID here.
client_id=1361448446862692492

# What the status text in the member list is built from:
#   0 = app name         -> "Watching Stremio"
#   1 = state line       -> "Watching Season 2 - Episode 5"
#   2 = details line     -> "Watching <movie or show title>"
status_display_type=2

# "View on IMDb" button under the presence (other people see it, not you)
show_buttons=yes

# Use the poster as the large image
show_poster=yes

# Extra messages in mpv's log
debug=no
